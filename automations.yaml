- id: bin1_fan
  alias: Bin 1 Fan
  description: ''
  use_blueprint:
    path: grain_smart_bin/smart_bin_fan_protection.yaml
    input:
      bin_label: Bin 1
      fan_switch: switch.bin1
      amps_sensor: sensor.bin1amps
      volts_sensor: sensor.bin1volts
      fan_mode: input_select.bin1_fan_mode
      outside_temp: sensor.temp
      outside_humidity: sensor.humidity
      grain_temp: sensor.bin1
      dewpoint_sensor: sensor.dewpoint
      condensation_protection: input_boolean.bin1_condensation_protection
      condensation_margin: input_number.bin1_condensation_margin
      auto_cool_temp: input_number.bin1_auto_cool_temp
      auto_cool_temp_deadband: input_number.bin1_auto_cool_temp_deadband
      auto_cool_humidity: input_number.bin1_auto_cool_humidity
      auto_cool_paused: input_boolean.bin1_auto_cool_paused
      auto_cool_pause_reason: input_text.bin1_auto_cool_pause_reason
      auto_active: input_boolean.bin1_auto
      trip_latched: input_boolean.bin1_trip
      start_button: input_button.bin1_auto_start
      stop_button: input_button.bin1_auto_stop
      clear_trip_button: input_button.bin1_clear_trip
      auto_runtime_hours: input_number.bin1_auto_max_runtime_hours
      auto_seconds_left: input_number.bin1_auto_seconds_left
      auto_start_time: input_datetime.bin1_auto_start_time
      manual_start_time: input_datetime.bin1_manual_start
      fla_number: input_number.bin1_fla
      mult_start_number: input_number.bin1_mult_start
      mult_run_number: input_number.bin1_mult_run
      startup_trip_seconds: input_select.bin1_startup_trip_seconds
      running_trip_seconds: input_select.bin1_running_trip_seconds
      startup_ignore_seconds: input_number.bin1_startup_ignore_seconds
      last_trip_stage: input_text.bin1_last_trip_stage
      last_trip_reason: input_text.bin1_last_trip_reason
      last_trip_time: input_datetime.bin1_last_trip_time
      last_known_state: input_text.bin1_last_known_state
      last_known_update: input_datetime.bin1_last_known_update
      reset_lifetime_button: input_button.bin1_reset_lifetime_cost
      lifetime_energy_total_kwh: sensor.bin1_energy_total_kwh
      reset_savings_button: input_button.bin1_reset_auto_cool_savings
      savings_energy_total_kwh: sensor.bin1_auto_cool_saved_total_kwh
      global_last_start: input_datetime.fan_start_queue_last_start
      global_stagger_seconds: input_number.fan_start_queue_stagger_seconds
