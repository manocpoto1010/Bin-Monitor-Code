################################################################################
# emc.yaml  ✅ BULLETPROOF ENTITY IDS (FIXED / HARDENED)
# - Base EMC sensors: sensor.emc_wheat_percent / durum / canola
# - Per-bin EMC sensors: sensor.bin1_emc ... sensor.bin10_emc  (NO EXTRA "_")
#
# IMPORTANT:
# - This assumes your outside sensors are: sensor.temp and sensor.humidity
#   If yours are different, change ONLY those two entity_ids below.
################################################################################

template:
  - sensor:

      # =========================================================================
      # BASE INPUTS (Outside Air)
      # =========================================================================

      - name: "EMC Wheat Percent"
        unique_id: emc_wheat_percent
        unit_of_measurement: "%"
        state: >
          {% set t = states('sensor.temp') %}
          {% set rh = states('sensor.humidity') %}
          {% set last = this.state | float(default=0) %}
          {% if t in ['unknown','unavailable','none',''] or rh in ['unknown','unavailable','none',''] %}
            {{ last }}
          {% else %}
            {# Placeholder until your Henderson math is in here #}
            {{ 0 }}
          {% endif %}
        availability: >
          {{ states('sensor.temp') not in ['unknown','unavailable','none',''] and
             states('sensor.humidity') not in ['unknown','unavailable','none',''] }}

      - name: "EMC Durum Percent"
        unique_id: emc_durum_percent
        unit_of_measurement: "%"
