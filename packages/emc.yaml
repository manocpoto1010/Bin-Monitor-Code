            {{ last }}
          {% else %}
            {# Placeholder until your Henderson math is in here #}
            {{ 0 }}
          {% endif %}
        availability: >
          {{ states('sensor.temp') not in ['unknown','unavailable','none',''] and
             states('sensor.humidity') not in ['unknown','unavailable','none',''] }}

      # =========================================================================
      # PER-BIN EMC (STABLE ENTITY IDS: sensor.bin1_emc ... sensor.bin10_emc)
      # Uses commodity selection to pick wheat/durum/canola base EMC.
      # Keeps last good value if base EMC is unknown/unavailable.
      # =========================================================================

      - name: "Bin1 EMC"
        unique_id: bin1_emc
        unit_of_measurement: "%"
        state: >
          {% set last = this.state | float(default=0) %}
          {% set c = (states('input_select.bin1_commodity') | string | lower) %}
          {% set e =
               'sensor.emc_durum_percent' if 'durum' in c else
               'sensor.emc_canola_percent' if 'canola' in c else
               'sensor.emc_wheat_percent'
          %}
          {% set v = states(e) %}
          {% if v in ['unknown','unavailable','none',''] %}
            {{ last }}
          {% else %}
            {{ v | float(default=last) }}
          {% endif %}

