          {% if t in ['unknown','unavailable','none',''] or rh in ['unknown','unavailable','none',''] %}
            {{ last }}
          {% else %}
            {# Placeholder until your Henderson math is in here #}
            {{ 0 }}
          {% endif %}
        availability: >
          {{ states('sensor.temp') not in ['unknown','unavailable','none',''] and
             states('sensor.humidity') not in ['unknown','unavailable','none',''] }}

      - name: "EMC Canola Percent"
        unique_id: emc_canola_percent
